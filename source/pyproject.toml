[project]
name = "server"
version = "0.1.0"
description = "A simple tool for learning"
readme = "README.md"
authors = [
    { name = "Madhav Rimal", email = "madhavprapanna@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "bcrypt>=5.0.0",
    "fastapi>=0.141.1",
    "matplotlib>=3.11.1",
    "networkx>=3.6.1",
    "psycopg2-binary>=2.9.13",
    "pydantic[email]>=2.13.5",
    "pyjwt>=2.14.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "sqlmodel>=0.0.42",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
server = "server.main:main"

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = ["--import-mode=importlib"]
